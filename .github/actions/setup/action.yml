name: Setup bun workspace
description: >-
  Install bun and the workspace's dependencies. Shared by every CI job so the
  fan-out (typecheck / tests / build) pays one identical prologue instead of
  four hand-maintained copies. Assumes the repo is already checked out — a
  composite action cannot check out the repo it lives in.

runs:
  using: composite
  steps:
    - name: Setup bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        # Pinned rather than `latest`: setup-bun then serves a cached binary
        # instead of re-resolving every run, and silent version drift away from
        # the `packageManager` field in package.json becomes impossible. Keep
        # this in sync with package.json (`bun@1.3.14`) and the Dockerfile's
        # BUN_VERSION arg.
        bun-version: 1.3.14

    # bun's GLOBAL package cache, not node_modules. bun 1.3 links workspaces
    # with the isolated linker: `node_modules/.bun/<pkg>@<ver>/…` holding the
    # real files and every `packages/*/node_modules/<pkg>` a relative symlink
    # into it. Caching that symlink farm means archiving thousands of links
    # whose correctness depends on the exact layout bun happens to produce;
    # caching the tarball store instead leaves `bun install` to rebuild the
    # tree it wants, offline, in a couple of seconds.
    - name: Cache bun's package store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        # On a lockfile change, start from the previous store rather than
        # cold: almost every dependency in it is still the right version.
        restore-keys: |
          bun-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
