# Hooks run at commit time only.
#
# What is deliberately NOT here: the server and client test suites. They spawn
# real server processes and take ~35s of wall clock, which is a fine price for
# CI and a terrible one for every commit. game-core's suite is the exception —
# it is pure deterministic simulation, runs in about a second, and is the one
# place where a wrong answer is silently wrong on both sides of the wire.
default_stages: [pre-commit]

repos:
  # First, because a leaked bot token is the one mistake that cannot be fixed
  # by a follow-up commit. This repo keeps a real TELEGRAM_BOT_TOKEN, a webhook
  # secret, a session secret and a Neon connection string in .env — gitignored,
  # but one `git add -f` or a stray copy under a different name is all it takes.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # drizzle/ is generated by drizzle-kit and rewritten wholesale on the
        # next `db:generate`; normalising it here just starts a fight.
        exclude: '^(packages/server/drizzle/|bun\.lock$)'
      - id: trailing-whitespace
        exclude: '^(packages/server/drizzle/|bun\.lock$)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        # tsconfig.json is JSONC — TypeScript allows the comments, a strict
        # JSON parser does not — and drizzle's meta/ is generated.
        exclude: '(^packages/server/drizzle/|(^|/)tsconfig(\..*)?\.json$)'
      - id: check-added-large-files

  # The workflows in .github/ are only ever exercised by pushing them, so a
  # typo in an expression or a bad `needs:` reference is otherwise discovered
  # by a red run on main. actionlint also shellchecks the inline `run:` blocks,
  # which is where the deploy's real logic lives.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # The offline cheat-detection job under tools/ is the only Python in the repo.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # ~2s for all three packages, because both the server and the client set
      # `customConditions: ["development"]` and so typecheck against game-core's
      # SOURCE. That is exactly why this runs on ANY TypeScript change rather
      # than only the edited package: a change to the shared simulation breaks
      # its consumers, not itself.
      - id: typecheck
        name: typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
        files: '^packages/.*\.(ts|tsx)$'

      - id: game-core-tests
        name: game-core tests
        entry: bun run --filter @pong/game-core test
        language: system
        pass_filenames: false
        files: '^packages/game-core/(src|test)/.*\.ts$'

      # A manifest edited without regenerating the lockfile passes every local
      # check and then fails in CI and in the Docker build, both of which
      # install with --frozen-lockfile. `--dry-run` reconciles without writing.
      - id: lockfile-in-sync
        name: bun.lock is in sync with the manifests
        entry: bun install --frozen-lockfile --dry-run
        language: system
        pass_filenames: false
        files: '(^|/)package\.json$|^bun\.lock$'
