# Matches the ruff settings used in the sibling mtg-edh-builder repo, so the
# one Python file here is held to the same bar as Python elsewhere. 100 columns
# also happens to be roughly where the TypeScript in this repo sits.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN"]
ignore = ["ANN401"]
